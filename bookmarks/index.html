<header class="hero"><small>MY MOONLIGHT / 私人收藏</small><h1>我的月光</h1><p>有些句子讀過就過去了，有些卻值得留一點月光。這裡收著你在小說裡留下的句子，隨時可以沿原來的段落回到故事。</p></header>
<section aria-labelledby="saved-title"><div class="summary"><strong id="saved-title">留下的句子</strong><div class="collection-tools"><select id="work-filter" aria-label="依作品篩選"><option value="">全部作品</option></select><select id="view-mode" aria-label="收藏排序"><option value="recent">最近收藏</option><option value="work">依作品排列</option></select><span id="count"></span></div></div><div class="list" id="list"></div><div id="legacy"></div></section>
<p class="privacy">月光書籤保存在這個瀏覽器的本機儲存空間，不會上傳到伺服器；更換瀏覽器、裝置或清除網站資料後，收藏不會自動同步。</p>
</main><script>
(()=>{'use strict';
const list=document.getElementById('list'),count=document.getElementById('count'),legacy=document.getElementById('legacy'),filter=document.getElementById('work-filter'),view=document.getElementById('view-mode');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=()=>{try{const x=JSON.parse(localStorage.getItem('moonlit-bookmark-details')||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}};
let details=load().filter(x=>x&&x.bookId&&x.pid&&x.text&&x.url).sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
[...new Map(details.map(x=>[x.bookId,x.title||x.bookId])).entries()].sort((a,b)=>String(a[1]).localeCompare(String(b[1]),'zh-Hant')).forEach(([id,title])=>{const o=document.createElement('option');o.value=id;o.textContent=title;filter.appendChild(o)});
function humanPos(x){const m=String(x.pid||'').match(/(\d+)$/);return m?'第 '+m[1]+' 段':'已收藏段落'}
function removeBookmark(x){details=details.filter(d=>!(d.bookId===x.bookId&&d.pid===x.pid));try{localStorage.setItem('moonlit-bookmark-details',JSON.stringify(details));const k='moonlit-lines-'+x.bookId;let a=JSON.parse(localStorage.getItem(k)||'[]');if(Array.isArray(a)){a=a.filter(id=>id!==x.pid);localStorage.setItem(k,JSON.stringify(a))}}catch(e){}render()}
function render(){list.innerHTML='';let shown=details.filter(x=>!filter.value||x.bookId===filter.value);if(view.value==='work')shown=[...shown].sort((a,b)=>String(a.title||a.bookId).localeCompare(String(b.title||b.bookId),'zh-Hant')||((b.savedAt||0)-(a.savedAt||0)));count.textContent=shown.length+' / '+details.length+' 個';if(!shown.length){list.innerHTML='<div class="empty"><strong>'+(details.length?'這個作品還沒有月光':'今晚還沒有留下月光')+'</strong><p>'+(details.length?'換一個作品看看。':'閱讀小說時，點段落旁的 ☾ 就能把喜歡的句子收藏到這裡。')+'</p><a href="../#book">去小說書房看看 →</a></div>';return}shown.forEach(x=>{const article=document.createElement('article');article.className='bookmark';const when=x.savedAt?new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'short',day:'numeric'}).format(new Date(x.savedAt)):'';article.innerHTML='<div><small>'+esc(x.title)+'</small></div><blockquote>「'+esc(x.text)+'」</blockquote><div class="meta">'+esc(humanPos(x))+(when?'　·　收藏於 '+esc(when):'')+'</div><div class="bookmark-tools"><button type="button">移除這束月光</button></div><a class="go" href="'+esc(x.url)+'">返回原文 →</a>';article.querySelector('button').addEventListener('click',()=>removeBookmark(x));list.appendChild(article)})}
filter.addEventListener('change',render);view.addEventListener('change',render);render();
let legacyCount=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.startsWith('moonlit-lines-'))continue;const a=JSON.parse(localStorage.getItem(k)||'[]');if(Array.isArray(a))legacyCount+=a.filter(pid=>!details.some(d=>d.bookId===k.slice(14)&&d.pid===pid)).length}}catch(e){}if(legacyCount){legacy.className='legacy';legacy.innerHTML='另有 '+legacyCount+' 個較早版本的書籤只有段落位置，尚未保存原句。它們仍會在原小說中保持標記；重新收藏該段後，就會完整出現在「我的月光」。 <a href="../#book">回小說書房 →</a>'}
})();
</script><script src="../assets/moonlit-v2.js?v=20261003-runtime26"></script></body></html>
