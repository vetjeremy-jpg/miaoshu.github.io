name: Check novel readers

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'books/**'
      - 'assets/mobile-safety.css'
      - 'assets/homepage-inline.css'
      - 'assets/homepage-desktop-below-fold.css'
      - 'assets/homepage-mobile-below-fold.css'
      - 'assets/homepage-mobile.css'
      - 'assets/homepage-premium.css'
      - 'assets/moonlit-system.css'
      - 'assets/moonlit-v2.js'
      - 'assets/moonlit-*.js'
      - 'index.html'
      - 'gallery/**'
      - 'posts/**'
      - 'videos/**'
      - 'about/**'
      - 'site.webmanifest'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'sw.js'
      - 'book.html'
      - 'bookmarks/**'
      - 'newsletter/**'
      - 'search/**'
      - 'start/**'
      - 'works/**'
      - 'scripts/check-mobile-rwd.mjs'
      - 'scripts/check-internal-links.mjs'
      - 'scripts/check-seo.mjs'
      - 'scripts/check-moonlit-runtime.mjs'
      - 'scripts/check-css-ownership.mjs'
      - '.github/workflows/check-readers.yml'

permissions:
  contents: read

concurrency:
  group: moonlit-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Moonlit Contract Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Reader contract
        run: node books/check-readers.mjs

      - name: Mobile RWD contract
        run: node scripts/check-mobile-rwd.mjs

      - name: Internal link contract
        run: node scripts/check-internal-links.mjs

      - name: SEO contract
        run: node scripts/check-seo.mjs

      - name: Runtime contract
        run: node scripts/check-moonlit-runtime.mjs

      - name: CSS ownership contract
        run: node scripts/check-css-ownership.mjs

      - name: JavaScript syntax contract
        run: find assets -maxdepth 1 -type f -name 'moonlit-*.js' -print0 | xargs -0 -n1 node --check

      - name: Publish Moonlit contract summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Moonlit Contract QA"
            echo ""
            echo "- Reader structure and navigation"
            echo "- Mobile RWD and PWA safety"
            echo "- Internal links"
            echo "- SEO"
            echo "- Runtime invariants"
            echo "- CSS ownership budgets"
            echo "- Shared JavaScript syntax"
            echo "- **Tested commit:** \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
