name: Moonlit Internal Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Validate site contracts
        run: npm run test:static
      - name: Static checks summary
        if: always()
        run: |
          echo '## Moonlit static quality' >> "$GITHUB_STEP_SUMMARY"
          echo 'Validation includes resources, links, SEO, publishing, production, PWA version and metrics contracts.' >> "$GITHUB_STEP_SUMMARY"
          echo 'See the Validate site contracts step for pass/fail details.' >> "$GITHUB_STEP_SUMMARY"
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run release and PWA regression
        run: npm run test:nav:p0 && npm run test:rc && npm run test:pwa && npm run test:reader && npm run test:runtime-zero && npm run test:a11y-critical && npm run test:third-party && npm run test:nav:p1 && npm run test:editorial && npm run test:performance
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Write browser test summary
        if: always()
        run: |
          echo '## Moonlit browser regression' >> "$GITHUB_STEP_SUMMARY"
          echo 'Checks: navigation, release, PWA, reader, runtime, accessibility, third-party, editorial, performance.' >> "$GITHUB_STEP_SUMMARY"
          echo 'See job steps for individual outcomes; failure artifacts are retained for 7 days.' >> "$GITHUB_STEP_SUMMARY"
