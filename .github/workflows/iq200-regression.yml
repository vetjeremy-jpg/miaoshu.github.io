name: IQ200 Regression Hardening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iq200-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: http://127.0.0.1:8765/miaoshu.github.io/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Serve PR checkout at production-equivalent subpath
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/moonlit-preview"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/moonlit-preview/miaoshu.github.io"
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/moonlit-preview" > "$RUNNER_TEMP/moonlit-preview.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null "$BASE_URL"; then
              echo "PR preview server ready: $BASE_URL"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/moonlit-preview.log"
          exit 1
      - name: Enforce PR preview origin
        run: npx playwright test tests/preview-origin.spec.js
      - name: Verify static contracts
        run: npm run test:static
      - name: Verify critical navigation
        run: npm run test:nav:p0
      - name: Verify reader journey
        run: npm run test:reader
      - name: Verify PWA lifecycle
        run: npm run test:pwa
      - name: Verify runtime errors
        run: npm run test:runtime-zero
      - name: Verify accessibility
        run: npm run test:a11y-critical
      - name: Verify third-party resilience
        run: npm run test:third-party
      - name: Capture preview server diagnostics
        if: failure()
        shell: bash
        run: |
          echo '## Preview server diagnostics' >> "$GITHUB_STEP_SUMMARY"
          if test -f "$RUNNER_TEMP/moonlit-preview.log"; then
            tail -n 100 "$RUNNER_TEMP/moonlit-preview.log" | tee "$RUNNER_TEMP/moonlit-preview-tail.log"
          else
            echo 'Preview log not available' | tee "$RUNNER_TEMP/moonlit-preview-tail.log"
          fi
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iq200-playwright-failures
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/moonlit-preview-tail.log
          if-no-files-found: ignore
          retention-days: 7
