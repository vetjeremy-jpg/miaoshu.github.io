name: Production Smoke Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Wait for GitHub Pages propagation
        run: sleep 90
      - name: Compare live website against merged main
        env:
          MOONLIT_MAIN_SHA: ${{ github.sha }}
          MOONLIT_EVENT_NAME: ${{ github.event_name }}
          MOONLIT_ACTIONS_RUN_ID: ${{ github.run_id }}
          MOONLIT_ACTIONS_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/check-production-smoke.mjs
      - name: Upload production verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-smoke-report
          path: production-smoke-report.json
          if-no-files-found: ignore
          retention-days: 14
