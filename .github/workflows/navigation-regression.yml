name: Navigation Regression

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'books/**'
      - 'sw.js'
      - 'site.webmanifest'
      - 'apple-touch-icon.png'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/quality-engineering-contract-v1.md'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/navigation-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'books/**'
      - 'sw.js'
      - 'site.webmanifest'
      - 'apple-touch-icon.png'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/quality-engineering-contract-v1.md'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/navigation-regression.yml'
  workflow_dispatch:

permissions:
  contents: read


concurrency:
  group: navigation-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation-regression:
    name: Homepage Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Resolve Playwright version
        id: playwright_version
        shell: bash
        run: node -e "const p=require('./package-lock.json'); console.log('version='+p.packages['node_modules/@playwright/test'].version)" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: playwright_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright_version.outputs.version }}-chromium

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Start local static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/moonlit-http.log 2>&1 &
          echo $! > /tmp/moonlit-http.pid

      - name: Wait for site
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/moonlit-http.log
          exit 1

      - name: Run blocking P0 navigation gate
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: npm run test:nav:p0

      - name: Run cross-page release candidate gate
        id: rc_gate
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: npm run test:rc

      - name: Start GitHub Pages prefix mirror for PWA
        run: |
          mkdir -p /tmp/moonlit-pwa
          ln -sfn "$GITHUB_WORKSPACE" /tmp/moonlit-pwa/miaoshu.github.io
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/moonlit-pwa > /tmp/moonlit-pwa-http.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4174/miaoshu.github.io/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/moonlit-pwa-http.log
          exit 1

      - name: Run PWA lifecycle gate
        id: pwa_gate
        env:
          BASE_URL: http://127.0.0.1:4174/miaoshu.github.io/
        run: npm run test:pwa

      # Four-width retention contract: 320 / 375 / 390 / 430.
      - name: Run homepage editorial and responsive gate
        id: editorial_gate
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: npm run test:editorial

      - name: Run homepage performance regression gate
        id: performance_gate
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: npm run test:performance

      - name: Run novel reader journey gate
        id: reader_gate
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: npm run test:reader

      - name: Run runtime zero-error gate
        id: runtime_zero_gate
        env:
          BASE_URL: http://127.0.0.1:4174/miaoshu.github.io/
        run: npm run test:runtime-zero

      - name: Run critical accessibility gate
        id: a11y_gate
        env:
          BASE_URL: http://127.0.0.1:4174/miaoshu.github.io/
        run: npm run test:a11y-critical

      - name: Run third-party outage resilience gate
        id: third_party_gate
        env:
          BASE_URL: http://127.0.0.1:4174/miaoshu.github.io/
        run: npm run test:third-party

      - name: Run P1 interaction suite
        id: p1_gate
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: npm run test:nav:p1

      - name: Publish navigation QA summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Moonlit Navigation QA"
            echo ""
            echo "- **Release candidate:** ${{ steps.rc_gate.outcome }}"
            echo "- **PWA lifecycle:** ${{ steps.pwa_gate.outcome }}"
            echo "- **Editorial / responsive:** ${{ steps.editorial_gate.outcome }}"
            echo "- **Performance regression:** ${{ steps.performance_gate.outcome }}"
            echo "- **Novel reader journey:** ${{ steps.reader_gate.outcome }}"
            echo "- **Runtime zero-error:** ${{ steps.runtime_zero_gate.outcome }}"
            echo "- **Critical accessibility:** ${{ steps.a11y_gate.outcome }}"
            echo "- **Third-party outage resilience:** ${{ steps.third_party_gate.outcome }}"
            echo "- **P1 interaction:** ${{ steps.p1_gate.outcome }}"
            echo "- **Viewports:** 320 / 375 / 390 / 430 / 768 / 1024 / 1440"
            echo "- **Tested commit:** ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: navigation-playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: navigation-test-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
