name: Navigation Regression

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/navigation-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/navigation-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

# Lock candidate is generated by npm itself in CI.

concurrency:
  group: navigation-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation-regression:
    name: P0 Navigation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate deterministic npm lock candidate
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "MOONLIT_LOCK_BEGIN"
          base64 -w 0 package-lock.json
          echo
          echo "MOONLIT_LOCK_END"

      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/moonlit-http.log 2>&1 &
          echo $! > /tmp/moonlit-http.pid

      - name: Wait for site
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/moonlit-http.log
          exit 1

      - name: Run blocking P0 navigation gate
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: npm run test:nav:p0

      - name: Run P1 interaction suite before merge or on manual verification
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: npm run test:nav:p1

      - name: Publish navigation QA summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Moonlit Navigation QA"
            echo ""
            echo "- **P0 gate:** 9 entries, video route, ARIA, mobile rail, 44px targets, overflow and mobile-safety cascade"
            echo "- **Viewports:** 320 / 375 / 390 / 430 / 768 / 1024 / 1440"
            if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "- **P1 interaction:** Tab / Shift+Tab / focus visibility"
            else
              echo "- **P1 interaction:** deferred to PR or manual full verification"
            fi
            echo "- **Tested commit:** \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-test-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
