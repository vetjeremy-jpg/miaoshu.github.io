name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moonlit-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Static / Content / PWA Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate site contract
        run: node scripts/check-quality-contract.mjs

  regression:
    name: Browser Regression Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/moonlit-http.log 2>&1 &
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/moonlit-http.log; exit 1
      - name: Core browser contracts
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: |
          npm run test:nav:p0
          npm run test:rc
          npm run test:editorial
          npm run test:performance
          npm run test:reader
          npm run test:nav:p1
      - name: Start project-scope mirror
        run: |
          mkdir -p /tmp/moonlit-pwa
          ln -sfn "$GITHUB_WORKSPACE" /tmp/moonlit-pwa/miaoshu.github.io
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/moonlit-pwa >/tmp/moonlit-pwa-http.log 2>&1 &
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:4174/miaoshu.github.io/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/moonlit-pwa-http.log; exit 1
      - name: PWA lifecycle contract
        env:
          BASE_URL: http://127.0.0.1:4174/miaoshu.github.io/
        run: npm run test:pwa
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-gate-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
