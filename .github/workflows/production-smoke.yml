name: Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * 1,4'

permissions:
  contents: read

concurrency:
  group: moonlit-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Live GitHub Pages Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout smoke contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify production site
        run: node scripts/check-production-smoke.mjs

      - name: Publish production summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Moonlit Production Smoke"
            echo ""
            echo "- **Site:** https://vetjeremy-jpg.github.io/miaoshu.github.io/"
            echo "- **Tested commit:** ${{ github.sha }}"
            if [[ -f production-smoke-report.json ]]; then
              node -e "const fs=require('fs'),r=JSON.parse(fs.readFileSync('production-smoke-report.json','utf8')); console.log('- **Runtime fingerprint:** '+r.liveRuntime+' ✓'); console.log('- **Homepage fingerprint:** '+r.homepageFingerprint.live.slice(0,12)+' ✓'); for(const x of r.routeFingerprints||[]) console.log('- **'+x.path+' fingerprint:** '+x.live.slice(0,12)+' ✓'); console.log('- **SW caches:** '+r.serviceWorker.shell+' / '+r.serviceWorker.pages); console.log(''); console.log('| Resource | Content-Type | Cache-Control | Age | Last-Modified |'); console.log('|---|---|---|---:|---|'); for(const x of r.resources) console.log('| '+x.label+' | '+x.contentType+' | '+x.cacheControl+' | '+x.age+' | '+x.lastModified+' |');"
            else
              echo "- Diagnostic report unavailable because verification did not reach report generation."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-smoke-diagnostics-${{ github.run_id }}
          path: production-smoke-report.json
          if-no-files-found: ignore
          retention-days: 14
