name: Production Smoke

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * 1,4'

permissions:
  contents: read

concurrency:
  group: moonlit-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Live GitHub Pages Smoke
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    # Runtime propagation retries can exceed five minutes under slow Pages/CDN convergence.
    timeout-minutes: 20
    steps:
      - name: Checkout deployed main contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify deployed commit identity
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          deployed="${{ github.event.workflow_run.head_sha }}"
          current="$(git rev-parse HEAD)"
          if [[ "$deployed" != "$current" ]]; then
            if git merge-base --is-ancestor "$deployed" "$current"; then
              echo "::notice::Skipping superseded Pages deployment: $deployed; current main is $current."
              echo "MOONLIT_SUPERSEDED_DEPLOYMENT=true" >> "$GITHUB_ENV"
            else
              echo "::error::Pages deployment SHA is not current main or an ancestor of it."
              echo "deployed=$deployed"
              echo "main=$current"
              exit 1
            fi
          fi

      - name: Verify production site
        if: env.MOONLIT_SUPERSEDED_DEPLOYMENT != 'true'
        env:
          MOONLIT_MAIN_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          MOONLIT_EVENT_NAME: ${{ github.event_name }}
          MOONLIT_ACTIONS_RUN_ID: ${{ github.run_id }}
          MOONLIT_ACTIONS_RUN_ATTEMPT: ${{ github.run_attempt }}
          MOONLIT_PAGES_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          MOONLIT_PAGES_RUN_URL: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.html_url || '' }}
        run: node scripts/check-production-smoke.mjs

      - name: Publish production summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Moonlit Production Smoke"
            echo ""
            echo "- **Site:** https://vetjeremy-jpg.github.io/miaoshu.github.io/"
            echo "- **Main contract commit:** $(git rev-parse HEAD)"
            if [[ "${{ github.event_name }}" == "workflow_run" ]]; then echo "- **Pages deployed commit:** ${{ github.event.workflow_run.head_sha }}"; fi
            if [[ "${MOONLIT_SUPERSEDED_DEPLOYMENT:-}" == "true" ]]; then echo "- **Result:** superseded deployment skipped ✓"; fi
            if [[ -f production-smoke-report.json ]]; then
              node -e "const fs=require('fs'),r=JSON.parse(fs.readFileSync('production-smoke-report.json','utf8')); console.log('- **Runtime fingerprint:** '+r.liveRuntime+' ✓'); console.log('- **Homepage fingerprint:** '+r.homepageFingerprint.live.slice(0,12)+' ✓'); console.log('- **Published novels verified:** '+r.publishedNovelCount+' ✓'); console.log('- **Published posts verified:** '+r.publishedPostCount+' ✓'); for(const x of r.routeFingerprints||[]) console.log('- **'+x.path+' fingerprint:** '+x.live.slice(0,12)+' ✓'); console.log('- **SW caches:** '+r.serviceWorker.shell+' / '+r.serviceWorker.pages); console.log(''); console.log('| Resource | Content-Type | Cache-Control | Age | Last-Modified |'); console.log('|---|---|---|---:|---|'); for(const x of r.resources) console.log('| '+x.label+' | '+x.contentType+' | '+x.cacheControl+' | '+x.age+' | '+x.lastModified+' |');"
            else
              echo "- Diagnostic report unavailable because verification did not reach report generation."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-smoke-diagnostics-${{ github.run_id }}
          path: production-smoke-report.json
          if-no-files-found: ignore
          retention-days: 30
