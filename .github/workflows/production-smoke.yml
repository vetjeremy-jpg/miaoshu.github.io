name: Production Smoke

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * 1,4'

permissions:
  contents: read

concurrency:
  group: moonlit-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Live GitHub Pages Smoke
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout deployed main contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify deployed commit identity
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          test "${{ github.event.workflow_run.head_sha }}" = "$(git rev-parse HEAD)" || {
            echo "::error::Pages deployment SHA does not match current main. A newer main may be pending deployment."
            echo "deployed=${{ github.event.workflow_run.head_sha }}"
            echo "main=$(git rev-parse HEAD)"
            exit 1
          }

      - name: Verify production site
        env:
          MOONLIT_MAIN_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          MOONLIT_EVENT_NAME: ${{ github.event_name }}
          MOONLIT_ACTIONS_RUN_ID: ${{ github.run_id }}
          MOONLIT_ACTIONS_RUN_ATTEMPT: ${{ github.run_attempt }}
          MOONLIT_PAGES_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          MOONLIT_PAGES_RUN_URL: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.html_url || '' }}
        run: node scripts/check-production-smoke.mjs

      - name: Publish production summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Moonlit Production Smoke"
            echo ""
            echo "- **Site:** https://vetjeremy-jpg.github.io/miaoshu.github.io/"
            echo "- **Main contract commit:** $(git rev-parse HEAD)"
            if [[ "${{ github.event_name }}" == "workflow_run" ]]; then echo "- **Pages deployed commit:** ${{ github.event.workflow_run.head_sha }}"; fi
            if [[ -f production-smoke-report.json ]]; then
              node -e "const fs=require('fs'),r=JSON.parse(fs.readFileSync('production-smoke-report.json','utf8')); console.log('- **Runtime fingerprint:** '+r.liveRuntime+' ✓'); console.log('- **Homepage fingerprint:** '+r.homepageFingerprint.live.slice(0,12)+' ✓'); for(const x of r.routeFingerprints||[]) console.log('- **'+x.path+' fingerprint:** '+x.live.slice(0,12)+' ✓'); console.log('- **SW caches:** '+r.serviceWorker.shell+' / '+r.serviceWorker.pages); console.log(''); console.log('| Resource | Content-Type | Cache-Control | Age | Last-Modified |'); console.log('|---|---|---|---:|---|'); for(const x of r.resources) console.log('| '+x.label+' | '+x.contentType+' | '+x.cacheControl+' | '+x.age+' | '+x.lastModified+' |');"
            else
              echo "- Diagnostic report unavailable because verification did not reach report generation."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-smoke-diagnostics-${{ github.run_id }}
          path: production-smoke-report.json
          if-no-files-found: ignore
          retention-days: 30
