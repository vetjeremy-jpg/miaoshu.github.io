name: "讀者與粉絲留言"
description: "與喵叔分享閱讀心得、攝影或影片想法"
title: "[讀者留言] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        歡迎來到喵叔的交流區！留言將公開顯示於 GitHub Issues，請勿留下電話、住址或其他私人資訊。
  - type: dropdown
    id: topic
    attributes:
      label: "想聊的主題"
      options:
        - "《浮生歲月》"
        - "《兩種天空》"
        - "寫作與生活"
        - "攝影"
        - "影片"
        - "其他"
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: "想對喵叔說的話"
      description: "可以分享讀後感、提問或創作建議。"
      placeholder: "我想分享的是……"
    validations:
      required: true
  - type: checkboxes
    id: public
    attributes:
      label: "公開留言提醒"
      options:
        - label: "我了解留言與回覆會公開顯示，且需登入 GitHub 帳號。"
          required: true
