);padding:14px;transition:.3s}.theme-node strong{display:block;font:500 18px/1.35 "Noto Serif TC","Songti TC",serif}.theme-node small{display:block;margin-top:5px;color:#8fa6b9;font-size:10px;letter-spacing:.08em}.work-node a{display:flex;align-items:center;gap:9px;max-width:185px;padding:9px 11px;border:1px solid rgba(205,225,243,.12);border-radius:999px;background:rgba(7,17,29,.82);color:#c8d2da;text-decoration:none;font-size:13px;line-height:1.35;backdrop-filter:blur(5px);transition:.3s}.work-node a:before{content:"";flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:#91aabd;box-shadow:0 0 12px rgba(185,213,238,.5)}.star-node.is-related{z-index:4}.theme-node.is-related button,.theme-node.is-selected button{border-color:#e4d2af;box-shadow:0 0 0 7px rgba(228,210,175,.045),0 0 38px rgba(205,225,243,.25);color:#fff}.work-node.is-visited a{border-color:rgba(228,210,175,.48);box-shadow:0 0 20px rgba(228,210,175,.08)}.work-node.is-visited a:before{background:#e4d2af}.star-lines polyline.reading-trail{fill:none;stroke:rgba(228,210,175,.5);stroke-width:.32;stroke-dasharray:1.2 1.2;vector-effect:non-scaling-stroke}.work-node.is-related a,.work-node.is-selected a{border-color:rgba(228,210,175,.62);color:#f5ead5;background:rgba(22,39,55,.94)}.work-node.is-related a:before,.work-node.is-selected a:before{background:#e4d2af;box-shadow:0 0 16px rgba(228,210,175,.8)}.star-node.is-dim{opacity:.25}.star-detail{position:absolute;z-index:6;left:22px;bottom:20px;width:min(370px,calc(100% - 44px));padding:17px 18px;background:rgba(5,15,25,.88);border:1px solid rgba(205,225,243,.14);backdrop-filter:blur(9px);box-sizing:border-box}.star-detail span{display:block;color:#8ea5b8;font-size:10px;letter-spacing:.16em}.star-detail strong{display:block;margin:5px 0;color:#f2eadb;font:500 21px/1.4 "Noto Serif TC","Songti TC",serif}.star-detail p{margin:0;color:#aebdca;font-size:13px;line-height:1.7}.legend{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 0;color:#8297a8;font-size:1 </style><link rel="stylesheet" href="../assets/moonlit-v2.css?v=20260930"></head><body><main class="wrap"><nav><a href="../">← Moonlit Stories</a>　<a href="../search/">搜尋創作</a></nav><header class="hero"><span>WORK CONSTELLATION / 作品星圖</span><h1>不是同一個宇宙，<br>卻在同一片夜色裡。</h1><p>不把彼此獨立的故事硬連成世界觀，而是讓題材、時代與氣質成為星軌。滑過或點選一枚題材星，看看哪些作品在月光下彼此靠近。</p></header><div class="star-toolbar" id="star-filters" aria-label="作品星圖篩選"></div><section class="star-map" id="star-map" aria-label="互動作品星圖"><svg class="star-lines" id="star-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg><div id="star-nodes"></div><div class="star-detail" id="star-detail" aria-live="polite"><span>HOW TO EXPLORE</span><strong>從一枚題材星開始</strong><p>Hover 或點選題材可看見相關作品與星軌；點作品名稱即可進入閱讀。</p></div></section><div class="legend"><span>題材／氣質節點</span><span>作品節點</span></div><section class="fallback-list" id="fallback-list" aria-label="手機版作品分類"></section></main><script>
(function(){const root=document.getElementById("star-map");if(!root)return;
const themes=[
{id:"east",name:"刀光與舊夢",meta:"江湖・歷史・東方",x:19,y:23,desc:"城池、江湖、古意與人在時代裡的選擇。"},
{id:"human",name:"人間微光",meta:"歲月・現實・情感",x:78,y:22,desc:"家族、記憶、現實與漫長歲月留下的情感。"},
{id:"unknown",name:"星海之外",meta:"異境・科幻・未知",x:76,y:68,desc:"當熟悉世界裂開縫隙，未知從另一側凝視。"},
{id:"snow",name:"緋色雪夜",meta:"雪・異國・刀",x:22,y:68,desc:"雪、刀與異國氣息交會出的孤寂溫度。"}];
const works=[
{id:"jiankang",name:"《建康劫·聽泉引》",url:"../books/jiankangjie-tingquanyin/",x:35,y:17,themes:["east"]},
{id:"wuxi",name:"《烏溪月》",url:"../books/wuxiyue/",x:35,y:31,themes:["east","human"]},
{id:"fengmen",name:"《風門夜譚》",url:"../books/fengmen-yetan/",x:12,y:43,themes:["east","unknown"]},
{id:"canzhao",name:"《殘照寫龍契》",url:"../books/canzhao-xie-longqi/",x:38,y:48,themes:["east","unknown"]},
{id:"fusheng",name:"《浮生歲月》",url:"../books/fushengsuiyue/",x:61,y:16,themes:["human"]},
{id:"sky",name:"《兩種天空》",url:"../books/liangzhongtiankong/",x:63,y:32,themes:["human"]},
{id:"sky2",name:"《兩種天空》Part 2",url:"../books/liangzhongtiankong-part2/",x:88,y:40,themes:["human"]},
{id:"alien",name:"《異形：起源之沙》",url:"../books/alien-origin-sands/",x:60,y:59,themes:["unknown"]},
{id:"sleep",name:"《沉睡的呼喚》",url:"../books/chenshui-de-huhuan/",x:61,y:76,themes:["unknown"]},
{id:"hiiro",name:"《緋色雪月抄》",url:"../books/hiiro-setsugetsusho/",x:39,y:69,themes:["snow","east"]}];
const all=[...themes.map(x=>({...x,type:"theme"})),...works.map(x=>({...x,type:"work"}))];const nodeBox=document.getElementById("star-nodes"),svg=document.getElementById("star-lines"),detail=document.getElementById("star-detail"),filters=document.getElementById("star-filters");let selected=null;
function el(tag,cls){const n=document.createElement(tag);if(cls)n.className=cls;return n}
themes.forEach(t=>{const w=el("div","star-node theme-node");w.dataset.id=t.id;w.style.left=t.x+"%";w.style.top=t.y+"%";const b=el("button");b.type="button";b.setAttribute("aria-label","探索題材："+t.name);b.innerHTML="<strong>"+t.name+"</strong><small>"+t.meta+"</small>";b.addEventListener("mouseenter",()=>highlight(t.id));b.addEventListener("mouseleave",()=>{if(!selected)clear()});b.addEventListener("focus",()=>highlight(t.id));b.addEventListener("blur",()=>{if(!selected)clear()});b.addEventListener("click",()=>select(t.id));w.appendChild(b);nodeBox.appendChild(w)});
works.forEach(wk=>{const w=el("div","star-node work-node");w.dataset.id=wk.id;w.style.left=wk.x+"%";w.style.top=wk.y+"%";const a=el("a");a.href=wk.url;a.textContent=wk.name;a.setAttribute("aria-label","閱讀 "+wk.name);a.addEventListener("mouseenter",()=>highlight(wk.id));a.addEventListener("mouseleave",()=>{if(!selected)clear()});a.addEventListener("focus",()=>highlight(wk.id));a.addEventListener("blur",()=>{if(!selected)clear()});w.appendChild(a);nodeBox.appendChild(w)});
let trail=[];try{trail=JSON.parse(localStorage.getItem("miaoshu-work-trail")||"[]")}catch(e){}trail=trail.filter(id=>works.some(w=>w.id===id)).slice(-8);
function renderTrail(){nodeBox.querySelectorAll(".work-node").forEach(n=>n.classList.toggle("is-visited",trail.includes(n.dataset.id)));svg.querySelectorAll(".reading-trail").forEach(x=>x.remove());const pts=trail.map(id=>works.find(w=>w.id===id)).filter(Boolean);if(pts.length>1){const p=document.createElementNS("http://www.w3.org/2000/svg","polyline");p.setAttribute("class","reading-trail");p.setAttribute("points",pts.map(w=>w.x+","+w.y).join(" "));svg.appendChild(p)}}
nodeBox.addEventListener("click",e=>{const a=e.target.closest(".work-node a");if(!a)return;const id=a.parentElement.dataset.id;trail=trail.filter(x=>x!==id);trail.push(id);try{localStorage.setItem("miaoshu-work-trail",JSON.stringify(trail.slice(-8)))}catch(err){}});
works.forEach(w=>w.themes.forEach(tid=>{const t=themes.find(x=>x.id===tid),l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",t.x);l.setAttribute("y1",t.y);l.setAttribute("x2",w.x);l.setAttribute("y2",w.y);l.dataset.theme=tid;l.dataset.work=w.id;svg.appendChild(l)}));
const reset=el("button");reset.type="button";reset.textContent="全部星圖";reset.className="is-active";reset.dataset.filter="all";reset.addEventListener("click",()=>{selected=null;clear();setFilter("all")});filters.appendChild(reset);themes.forEach(t=>{const b=el("button");b.type="button";b.textContent=t.name;b.dataset.filter=t.id;b.addEventListener("click",()=>{select(t.id);setFilter(t.id)});filters.appendChild(b)});
function related(id){const t=themes.find(x=>x.id===id);if(t)return new Set([id,...works.filter(w=>w.themes.includes(id)).map(w=>w.id)]);const w=works.find(x=>x.id===id);return w?new Set([id,...w.themes]):new Set}
function highlight(id){const r=related(id);document.querySelectorAll(".star-node").forEach(n=>{n.classList.toggle("is-related",r.has(n.dataset.id));n.classList.toggle("is-dim",!r.has(n.dataset.id))});svg.querySelectorAll("line").forEach(l=>{const on=l.dataset.theme===id||l.dataset.work===id||(r.has(l.dataset.theme)&&r.has(l.dataset.work));l.classList.toggle("is-related",on);l.classList.toggle("is-dim",!on)});show(id)}
function clear(){document.querySelectorAll(".star-node").forEach(n=>n.classList.remove("is-related","is-dim","is-selected"));svg.querySelectorAll("line").forEach(l=>l.classList.remove("is-related","is-dim"));detail.innerHTML="<span>HOW TO EXPLORE</span><strong>從一枚題材星開始</strong><p>Hover 或點選題材可看見相關作品與星軌；點作品名稱即可進入閱讀。</p>"}
function select(id){selected=selected===id?null:id;clear();if(selected){highlight(selected);const n=document.querySelector('.star-node[data-id="'+selected+'"]');if(n)n.classList.add("is-selected")}setFilter(selected&&themes.some(t=>t.id===selected)?selected:"all")}
function show(id){const t=themes.find(x=>x.id===id);if(t){const names=works.filter(w=>w.themes.includes(id)).map(w=>w.name).join("、");detail.innerHTML="<span>"+t.meta+"</span><strong>"+t.name+"</strong><p>"+t.desc+"<br>關聯作品："+names+"</p>";return}const w=works.find(x=>x.id===id);if(w){const names=w.themes.map(id=>themes.find(t=>t.id===id).name).join(" × ");detail.innerHTML="<span>WORK / 作品</span><strong>"+w.name+"</strong><p>關聯題材："+names+"。點作品名稱即可進入閱讀。</p>"}}
function setFilter(id){filters.querySelectorAll("button").forEach(b=>b.classList.toggle("is-active",b.dataset.filter===id))}
renderTrail();const mobile=document.getElementById("fallback-list");themes.forEach(t=>{const a=el("article","mobile-cluster");a.innerHTML="<small>"+t.meta+"</small><h2>"+t.name+"</h2><p>"+t.desc+"</p>";works.filter(w=>w.themes.includes(t.id)).forEach(w=>{const x=el("a");x.href=w.url;x.textContent=w.name;a.appendChild(x)});mobile.appendChild(a)});
})();
</script><script src="../assets/moonlit-v2.js?v=20260930"></script></body></html>
