tion><strong>01｜迎風起勢</strong><p>雪庭舞劍 · 人像影像創作</p></figcaption></figure><figure><a href="snow-sword-02-20260928.jpeg" target="_blank" rel="noopener" aria-label="放大檢視：雪庭凝神"><img src="snow-sword-02-20260928.jpeg" alt="雪景古風人像，女子手持長劍的舞劍姿態：雪庭凝神" width="1086" height="1448" loading="lazy" decoding="async"></a><figcaption><strong>02｜雪庭凝神</strong><p>雪庭舞劍 · 人像影像創作</p></figcaption></figure><figure><a href="snow-sword-03-20260928.jpeg" target="_blank" rel="noopener" aria-label="放大檢視：晚照劍影"><img src="snow-sword-03-20260928.jpeg" alt="雪景古風人像，女子手持長劍的舞劍姿態：晚照劍影" width="1086" height="1448" loading="lazy" decoding="async"></a><figcaption><strong>03｜晚照劍影</strong><p>雪庭舞劍 · 人像影像創作</p></figcaption></figure><figure><a href="snow-sword-04-20260928.jpeg" target="_blank" rel="noopener" aria-label="放大檢視：劍光掠雪"><img src="snow-sword-04-20260928.jpeg" alt="雪景古風人像，女子手持長劍的舞劍姿態：劍光掠雪" width="1086" height="1448" loading="lazy" decoding="async"></a><figcaption><strong>04｜劍光掠雪</strong><p>雪庭舞劍 · 人像影像創作</p></figcaption></figure><figure><a href="snow-sword-05-20260928.jpeg" target="_blank" rel="noopener" aria-label="放大檢視：一瞬回眸"><img src="snow-sword-05-20260928.jpeg" alt="雪景古風人像，女子手持長劍的舞劍姿態：一瞬回眸" width="1087" height="1447" loading="lazy" decoding="async"></a><figcaption><strong>05｜一瞬回眸</strong><p>雪庭舞劍 · 人像影像創作</p></figcaption></figure><figure><a href="snow-sword-06-20260928.jpeg" target="_blank" rel="noopener" aria-label="放大檢視：夕光入刃"><img src="snow-sword-06-20260928.jpeg" alt="雪景古風人像，女子手持長劍的舞劍姿態：夕光入刃" width="1086" height="1448" loading="lazy" decoding="async"></a><figcaption><strong>06｜夕光入刃</strong><p>雪庭舞劍 · 人像影像創作</p></figcaption></figure><figure><a href="snow-sword-07-20260928.jpeg" target="_blank" rel="noopener" aria-label="放大檢視：回身出劍"><img src="snow-sword-07-20260928.jpeg" alt="雪景古風人像，女子手持長劍的舞劍姿態：回身出劍" width="1086" height="1448" loading="lazy" decoding="async"></a><figcaption><strong>07｜回身出劍</strong><p>雪庭舞劍 · 人像影像創作</p></figcaption></figure><figure><a href="snow-sword-08-20260928.jpeg" target="_blank" rel="noopener" aria-label="放大檢視：雪中直刺"><img src="snow-sword-08-20260928.jpeg" alt="雪景古風人像，女子手持長劍的舞劍姿態：雪中直刺" width="1086" height="1448" loading="lazy" decoding="async"></a><figcaption><strong>08｜雪中直刺</strong><p>雪庭舞劍 · 人像影像創作</p></figcaption></figure><div class="collection-heading" id="earlier-work"><small>PHOTO JOURNAL</small><h2>光影片刻</h2></div><figure><a href="ChatGPT%20Image%202026%E5%B9%B49%E6%9C%883%E6%97%A5%20%E4%B8%8B%E5%8D%8804_36_27.png" target="_blank" rel="noopener"><img src="ChatGPT%20Image%202026%E5%B9%B49%E6%9C%883%E6%97%A5%20%E4%B8%8B%E5%8D%8804_36_27.png" alt="林蔭鐵道旁，女子倚靠大樹的人像攝影作品一" width="1086" height="1448" fetchpriority="high"></a><figcaption><strong>01｜午後樹影</strong><p>光穿過枝葉，落在舊鐵道旁。</p></figcaption></figure><figure><a href="ChatGPT%20Image%202026%E5%B9%B49%E6%9C%883%E6%97%A5%20%E4%B8%8B%E5%8D%8804_43_25.png" target="_blank" rel="noopener"><img src="ChatGPT%20Image%202026%E5%B9%B49%E6%9C%883%E6%97%A5%20%E4%B8%8B%E5%8D%8804_43_25.png" alt="林蔭鐵道旁，女子倚靠大樹的人像攝影作品二" width="1086" height="1448" loading="lazy"></a><figcaption><strong>02｜靜謐時刻</strong><p>在光與影之間，留住一瞬溫柔。</p></figcaption></figure><figure><a href="ChatGPT%20Image%202026%E5%B9%B49%E6%9C%883%E6%97%A5%20%E4%B8%8B%E5%8D%8804_34_30.png" target="_blank" rel="noopener"><img src="ChatGPT%20Image%202026%E5%B9%B49%E6%9C%883%E6%97%A5%20%E4%B8%8B%E5%8D%8804_34_30.png" alt="林蔭鐵道與大樹旁的人像攝影作品三" width="1086" height="1448" loading="lazy"></a><figcaption><strong>03｜林間微光</strong><p>在樹蔭與鐵道交會的午後，留下另一種光影。</p></figcaption></figure><figure><a href="moonlit-sunset-20260927.jpeg" target="_blank" rel="noopener"><img src="moonlit-sunset-20260927.jpeg" alt="暮色天空中一輪明月，橘紅晚霞映照遠方山巒" width="1086" height="1448" loading="lazy"></a><figcaption><strong>04｜月映晚霞</strong><p>橘紅雲霞與深藍暮色之間，明月靜靜升起。</p></figcaption></figure><figure><a href="taipei-sunset-skyline-20260927.jpeg" target="_blank" rel="noopener"><img src="taipei-sunset-skyline-20260927.jpeg" alt="台北101與城市燈火，在橘色晚霞及遠山映襯下漸次亮起" width="1086" height="1448" loading="lazy"></a><figcaption><strong>05｜台北暮光</strong><p>夕照退入群山，城市的燈火一盞盞亮起。</p></figcaption></figure><figure><a href="taipei-blue-hour-skyline-20260927.jpeg" target="_blank" rel="noopener"><img src="taipei-blue-hour-skyline-20260927.jpeg" alt="台北101與兩座橋梁上方的橙紫晚霞，城市夜燈映照群山" width="1448" height="1086" loading="lazy"></a><figcaption><strong>06｜城市入夜</strong><p>晚霞尚未散去，台北的光已在山前延展。</p></figcaption></figure><figure><a href="taipei-evening-city-lights-20260927.jpeg" target="_blank" rel="noopener"><img src="taipei-evening-city-lights-20260927.jpeg" alt="橘紅晚霞與遠山下的台北城市燈海，前景是深色山丘" width="1448" height="1086" loading="lazy"></a><figcaption><strong>07｜燈海與晚霞</strong><p>山影漸深，城市在橘紅天空下閃爍。</p></figcaption></figure><figure><a href="taipei-101-night-skyline-20260927.jpeg" target="_blank" rel="noopener"><img src="taipei-101-night-skyline-20260927.jpeg" alt="深藍夜空下的台北101與城市燈海，遠山仍留一抹暮光" width="1086" height="1448" loading="lazy"></a><figcaption><strong>08｜藍夜台北</strong><p>暮色落定，台北 101 與城市燈火照亮夜空。</p></figcaption></figure><figure><a href="taipei-101-night-panorama-20260927.jpeg" target="_blank" rel="noopener"><img src="taipei-101-night-panorama-20260927.jpeg" alt="藍色夜空與台北101、城市高樓及橋梁燈火的橫幅夜景" width="1448" height="1086" loading="lazy"></a><figcaption><strong>09｜夜色天際線</strong><p>群山與高樓之間，燈光勾勒台北的輪廓。</p></figcaption></figure></section></main><footer>© 2026 喵叔 Moonlit Stories · <a href="../index.html">回到首頁</a></footer></body></html>
