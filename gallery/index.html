83%E6%97%A5%20%E4%B8%8B%E5%8D%8804_36_27.png" alt="林蔭鐵道旁，女子倚靠大樹的人像攝影作品一" width="1086" height="1448" fetchpriority="high"></a><figcaption><strong>01｜午後樹影</strong><p>光穿過枝葉，落在舊鐵道旁。</p></figcaption></figure><figure><a href="ChatGPT%20Image%202026%E5%B9%B49%E6%9C%883%E6%97%A5%20%E4%B8%8B%E5%8D%8804_43_25.png" target="_blank" rel="noopener"><img src="ChatGPT%20Image%202026%E5%B9%B49%E6%9C%883%E6%97%A5%20%E4%B8%8B%E5%8D%8804_43_25.png" alt="林蔭鐵道旁，女子倚靠大樹的人像攝影作品二" width="1086" height="1448" loading="lazy"></a><figcaption><strong>02｜靜謐時刻</strong><p>在光與影之間，留住一瞬溫柔。</p></figcaption></figure><figure><a href="ChatGPT%20Image%202026%E5%B9%B49%E6%9C%883%E6%97%A5%20%E4%B8%8B%E5%8D%8804_34_30.png" target="_blank" rel="noopener"><img src="ChatGPT%20Image%202026%E5%B9%B49%E6%9C%883%E6%97%A5%20%E4%B8%8B%E5%8D%8804_34_30.png" alt="林蔭鐵道與大樹旁的人像攝影作品三" width="1086" height="1448" loading="lazy"></a><figcaption><strong>03｜林間微光</strong><p>在樹蔭與鐵道交會的午後，留下另一種光影。</p></figcaption></figure><figure><a href="moonlit-sunset-20260927.jpeg" target="_blank" rel="noopener"><img src="moonlit-sunset-20260927.jpeg" alt="暮色天空中一輪明月，橘紅晚霞映照遠方山巒" width="1086" height="1448" loading="lazy"></a><figcaption><strong>04｜月映晚霞</strong><p>橘紅雲霞與深藍暮色之間，明月靜靜升起。</p></figcaption></figure><figure><a href="taipei-sunset-skyline-20260927.jpeg" target="_blank" rel="noopener"><img src="taipei-sunset-skyline-20260927.jpeg" alt="台北101與城市燈火，在橘色晚霞及遠山映襯下漸次亮起" width="1086" height="1448" loading="lazy"></a><figcaption><strong>05｜台北暮光</strong><p>夕照退入群山，城市的燈火一盞盞亮起。</p></figcaption></figure><figure><a href="taipei-blue-hour-skyline-20260927.jpeg" target="_blank" rel="noopener"><img src="taipei-blue-hour-skyline-20260927.jpeg" alt="台北101與兩座橋梁上方的橙紫晚霞，城市夜燈映照群山" width="1448" height="1086" loading="lazy"></a><figcaption><strong>06｜城市入夜</strong><p>晚霞尚未散去，台北的光已在山前延展。</p></figcaption></figure><figure><a href="taipei-evening-city-lights-20260927.jpeg" target="_blank" rel="noopener"><img src="taipei-evening-city-lights-20260927.jpeg" alt="橘紅晚霞與遠山下的台北城市燈海，前景是深色山丘" width="1448" height="1086" loading="lazy"></a><figcaption><strong>07｜燈海與晚霞</strong><p>山影漸深，城市在橘紅天空下閃爍。</p></figcaption></figure><figure><a href="taipei-101-night-skyline-20260927.jpeg" target="_blank" rel="noopener"><img src="taipei-101-night-skyline-20260927.jpeg" alt="深藍夜空下的台北101與城市燈海，遠山仍留一抹暮光" width="1086" height="1448" loading="lazy"></a><figcaption><strong>08｜藍夜台北</strong><p>暮色落定，台北 101 與城市燈火照亮夜空。</p></figcaption></figure></section></main><footer>© 喵叔 Moonlit Stories · 攝影日記</footer></body></html>
